<div class="login" id="login" hidden></div>

        <div class="umenu" id="umenu"></div></div>
    </header>
    <main class="content" id="view"></main>
    <footer class="icp" id="icp" hidden></footer>
  </div>
</div>
<aside class="drawer" id="drawer"><header><h3 id="drTitle"></h3><button class="btn sm" data-close="1">关闭 ✕</button></header><div class="dbody" id="drBody"></div></aside>
